<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DriveSure is launching a new feature soon. Subscribe to get notified when we go live.">
    <title>Coming Soon | DriveSure License & Documentation</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; padding: 0; }
    </style>
</head>
<body class="fullscreen-page">

<main class="page-coming-soon">

    <!-- Top bar: logo + toggles -->
    <div class="coming-soon-topbar">
        <a href="index.html" class="coming-soon-logo" aria-label="DriveSure Home">
            <img src="logo.svg" alt="DriveSure Logo" width="36" height="36">
            <div class="nav-logo-text">
                <span class="brand-top" style="color:#fff;">DriveSure</span>
                <span class="brand-bottom">License & Documentation</span>
            </div>
        </a>
        <div class="coming-soon-toggles">
            <button onclick="toggleDir()" class="cs-toggle-btn" title="Toggle Direction" aria-label="Toggle RTL/LTR">
                <span class="dir-label" style="font-size:0.6rem;font-weight:700;">LTR</span>
            </button>
            <button onclick="toggleTheme()" class="cs-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
                <i class="fas fa-moon theme-icon"></i>
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="coming-soon-content">
        <!-- Icon -->
        <div style="width:80px;height:80px;background:rgba(201,162,39,0.15);border:1px solid rgba(201,162,39,0.25);border-radius:var(--radius-2xl);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
            <i class="fas fa-rocket" style="font-size:2rem;color:var(--secondary);"></i>
        </div>

        <div style="display:inline-flex;align-items:center;gap:0.5rem;font-size:0.75rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--secondary);border:1px solid rgba(201,162,39,0.25);padding:0.4rem 1rem;border-radius:999px;margin-bottom:1.25rem;">
            <i class="fas fa-wrench"></i> Under Development
        </div>

        <h1>Something Exciting<br>is Coming Soon</h1>
        <p>We're working hard to bring you a new feature that will make your driving license and documentation experience even smoother. Stay tuned!</p>

        <!-- Countdown -->
        <div class="countdown-row">
            <div class="countdown-box">
                <span class="countdown-num" id="cd-days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="cd-hours">00</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="cd-mins">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-num" id="cd-secs">00</span>
                <span class="countdown-label">Seconds</span>
            </div>
        </div>

        <!-- Notify form -->
        <form class="cs-notify-form" onsubmit="handleNotify(event)">
            <input type="email" class="cs-notify-input" placeholder="your@email.com" required aria-label="Email address">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-bell"></i> Notify Me
            </button>
        </form>

        <!-- Back link -->
        <div style="margin-top:2.5rem;">
            <a href="index.html" style="color:rgba(255,255,255,0.55);font-size:0.875rem;display:inline-flex;align-items:center;gap:0.375rem;transition:color 0.2s;" onmouseover="this.style.color='var(--secondary)'" onmouseout="this.style.color='rgba(255,255,255,0.55)'">
                <i class="fas fa-arrow-left"></i> Back to Homepage
            </a>
        </div>
    </div>

    <!-- Floating social links -->
    <div style="position:absolute;bottom:2rem;display:flex;gap:0.75rem;z-index:1;">
        <a href="#" class="footer-social-link" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="footer-social-link" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" class="footer-social-link" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="#" class="footer-social-link" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    </div>
</main>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initAuthPage();

        // Set countdown target: 60 days from now
        const target = new Date();
        target.setDate(target.getDate() + 60);
        initCountdown(target.getTime());
    });

    function handleNotify(e) {
        e.preventDefault();
        const input = e.target.querySelector('input');
        alert('Thank you! We\'ll notify you at ' + input.value + ' when we launch.');
        input.value = '';
    }

    // Override initCountdown for this page's specific elements
    function initCountdown(targetDate) {
        function update() {
            const now = Date.now();
            const diff = targetDate - now;
            if (diff <= 0) return;

            const pad = n => String(n).padStart(2, '0');
            const days = Math.floor(diff / 86400000);
            const hours = Math.floor((diff % 86400000) / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);

            const dEl = document.getElementById('cd-days');
            const hEl = document.getElementById('cd-hours');
            const mEl = document.getElementById('cd-mins');
            const sEl = document.getElementById('cd-secs');

            if (dEl) dEl.textContent = pad(days);
            if (hEl) hEl.textContent = pad(hours);
            if (mEl) mEl.textContent = pad(mins);
            if (sEl) sEl.textContent = pad(secs);
        }
        update();
        setInterval(update, 1000);
    }
</script>
</body>
</html>
