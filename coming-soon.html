<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Something exciting is coming soon to DriveSure — new RTO automation features, doorstep document tools, and service tracking. Stay tuned!">
    <title>Coming Soon | DriveSure License & Documentation</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-page">

<div class="fullscreen-topbar">
    <a href="index.html" class="nav-logo" aria-label="DriveSure Home">
        <img src="logo.svg" alt="DriveSure Logo" width="38" height="38" style="width:38px;height:38px;object-fit:contain;display:block;">
        <div class="nav-logo-text">
            <span class="brand-top">DriveSure</span>
            <span class="brand-bottom">License & Documentation</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<div class="fullscreen-content">
    <div style="max-width:600px;width:100%;margin:0 auto;">
        <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;margin:0 auto 1.75rem;animation:float 3s ease-in-out infinite;box-shadow:var(--shadow-lg);">
            <i class="fas fa-id-card" style="font-size:2rem;color:#fff;"></i>
        </div>

        <h1 style="font-size:clamp(1.75rem,4vw,2.5rem);margin-bottom:0.75rem;">Something Exciting is Coming</h1>
        <p style="font-size:1.0625rem;color:var(--text-muted);max-width:480px;margin:0 auto 2rem;line-height:1.7;">We're working on automated RTO document tracking, instant slot booking, and smart license management tools. Stay tuned!</p>

        <!-- Countdown -->
        <div class="countdown-grid" id="countdown">
            <div class="countdown-item">
                <div class="countdown-value" id="cd-days">12</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-hours">08</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-mins">45</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-value" id="cd-secs">30</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <div class="progress-bar-wrapper">
            <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
            <p style="text-align:center;font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;font-weight:600;">72% Complete</p>
        </div>

        <!-- Notify Form -->
        <form onsubmit="event.preventDefault(); alert('You\'re on the VIP list! We\'ll notify you as soon as we launch.'); this.reset();" class="cs-notify-form-wrapper">
            <input type="email" class="form-input" placeholder="Enter your email address" required>
            <button type="submit" class="btn btn-primary"><i class="fas fa-bell"></i> Notify Me</button>
        </form>

        <div style="display:flex;gap:0.875rem;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> Back to Home</a>
            <a href="services.html" class="btn btn-outline btn-sm"><i class="fas fa-layer-group"></i> Browse Services</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Countdown timer (demo: 12 days from now)
    const launchDate = new Date();
    launchDate.setDate(launchDate.getDate() + 12);
    launchDate.setHours(launchDate.getHours() + 8);

    function updateCountdown() {
        const now = new Date();
        const diff = launchDate - now;
        if (diff <= 0) return;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
        document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('cd-mins').textContent = String(mins).padStart(2, '0');
        document.getElementById('cd-secs').textContent = String(secs).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
});
</script>
</body>
</html>
