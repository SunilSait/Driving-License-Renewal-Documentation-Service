<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — DriveSure Driving License & Documentation Service. Return to our homepage.">
    <title>404 — Page Not Found | DriveSure</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }
    </style>
</head>
<body class="fullscreen-page">

<!-- Top controls -->
<div class="auth-topbar" style="position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;z-index:100;">
    <!-- Logo top-left links to home -->
    <a href="index.html" class="nav-logo" aria-label="DriveSure Home">
        <img src="logo.svg" alt="DriveSure Logo" width="36" height="36" class="nav-logo-img">
        <div class="nav-logo-text">
            <span class="brand-top">DriveSure</span>
            <span class="brand-bottom">License & Documentation</span>
        </div>
    </a>
    <!-- Theme / RTL -->
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle RTL/LTR">
            <span class="dir-label" style="font-size:0.6rem;font-weight:700;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<!-- 404 Content -->
<main class="page-404">
    <div class="page-404-content">
        <!-- Large background number -->
        <span class="error-code" aria-hidden="true">404</span>

        <div class="error-icon">
            <i class="fas fa-map-location-dot"></i>
        </div>

        <h1>Oops! Page Not Found</h1>
        <p>The page you're looking for seems to have taken a wrong turn. It may have been moved, deleted, or the URL might be incorrect.</p>

        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem;">
            <a href="index.html" class="btn btn-primary btn-lg">
                <i class="fas fa-home"></i> Go to Homepage
            </a>
            <a href="contact.html" class="btn btn-secondary btn-lg">
                Contact Us
            </a>
        </div>

        <!-- Quick Nav -->
        <div style="border-top:1px solid var(--border-default);padding-top:1.5rem;margin-top:0.5rem;">
            <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1rem;">Or visit one of these pages:</p>
            <div style="display:flex;gap:0.625rem;justify-content:center;flex-wrap:wrap;">
                <a href="services.html" class="btn btn-ghost btn-sm"><i class="fas fa-layer-group"></i> Services</a>
                <a href="documents.html" class="btn btn-ghost btn-sm"><i class="fas fa-file-alt"></i> Documents</a>
                <a href="fees.html" class="btn btn-ghost btn-sm"><i class="fas fa-tag"></i> Fees</a>
                <a href="login.html" class="btn btn-ghost btn-sm"><i class="fas fa-sign-in-alt"></i> Login</a>
            </div>
        </div>
    </div>
</main>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initAuthPage();
    });
</script>
</body>
</html>
