<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your DriveSure account to track license applications, get renewal reminders, and manage your driving documents online.">
    <title>Sign Up | DriveSure License & Documentation</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-page { background: var(--bg-surface); }
        .dark .auth-page { background: var(--bg-dark); }
        .auth-split { display: flex; min-height: 100dvh; }
        .auth-panel-left {
            flex: 1;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }
        .auth-panel-left::before {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: rgba(79,70,229,0.12);
            border-radius: 50%;
            filter: blur(80px);
        }
        .auth-panel-left::after {
            content: '';
            position: absolute;
            top: -15%;
            left: -15%;
            width: 350px;
            height: 350px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            filter: blur(60px);
        }
        .auth-panel-text { position: relative; z-index: 1; text-align: center; max-width: 360px; }
        .auth-panel-icon {
            width: 80px; height: 80px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: var(--radius-2xl);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .auth-panel-icon i { font-size: 2rem; color: #93C5FD; }
        .auth-panel-text h2 { color: #fff; font-size: 1.625rem; margin-bottom: 0.75rem; }
        .auth-panel-text p { color: rgba(255,255,255,0.65); font-size: 0.9375rem; font-weight: 400; }
        .auth-panel-badges { display: flex; flex-direction: column; gap: 0.625rem; margin-top: 2rem; }
        .auth-panel-badge { display: flex; align-items: center; gap: 0.625rem; color: rgba(255,255,255,0.75); font-size: 0.875rem; }
        .auth-panel-badge i { color: var(--secondary); flex-shrink: 0; }
        .auth-panel-right {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            position: relative;
            min-height: 100dvh;
        }
        @media (max-width: 768px) {
            .auth-panel-left { display: none; }
            .auth-panel-right { flex: 1; }
        }
    </style>
</head>
<body class="auth-page">

<!-- Top-right controls -->
<div class="auth-topbar">
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle RTL/LTR">
            <span class="dir-label" style="font-size:0.6rem;font-weight:700;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <i class="fas fa-moon theme-icon"></i>
        </button>
    </div>
</div>

<div class="auth-split">
    <!-- Form panel -->
    <div class="auth-panel-right">
        <div class="auth-card" style="max-width:460px;">
            <!-- Decorative orbs -->
            <div style="position:absolute;top:-60px;right:-60px;width:160px;height:160px;background:rgba(30,58,95,0.06);border-radius:50%;filter:blur(32px);pointer-events:none;" aria-hidden="true"></div>

            <!-- Logo -->
            <a href="index.html" class="auth-logo" aria-label="DriveSure Home">
                <img src="logo.svg" alt="DriveSure Logo" width="44" height="44">
                <div class="auth-logo-text">
                    <span class="brand-top">DriveSure</span>
                    <span class="brand-bottom">License & Documentation</span>
                </div>
            </a>

            <!-- Heading -->
            <div style="text-align:center;margin-bottom:1.75rem;">
                <h1 style="font-size:1.5rem;margin-bottom:0.375rem;">Create Your Account</h1>
                <p style="font-size:0.875rem;color:var(--text-muted);">Join thousands who trust DriveSure</p>
            </div>

            <!-- Social Sign Up -->
            <div class="social-login-grid">
                <button class="social-btn social-google" title="Sign up with Google" aria-label="Sign up with Google" onclick="alert('Google Sign-Up coming soon!')">
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.13C3.25 21.32 7.34 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.6H1.26C.46 8.2.01 10.04.01 12c0 1.96.45 3.8 1.25 5.4l4.02-3.13z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.25 2.68 1.26 6.6l4.02 3.13c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                </button>
                <button class="social-btn social-apple" title="Sign up with Apple" aria-label="Sign up with Apple" onclick="alert('Apple Sign-Up coming soon!')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.95.99-3.09-1 .04-2.17.67-2.88 1.5-.64.74-1.2 1.9-1.04 3.03 1.12.09 2.26-.62 2.93-1.44z"/>
                    </svg>
                </button>
                <button class="social-btn social-facebook" title="Sign up with Facebook" aria-label="Sign up with Facebook" onclick="alert('Facebook Sign-Up coming soon!')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </button>
            </div>

            <!-- Divider -->
            <div class="divider">or sign up with email</div>

            <!-- Form -->
            <form id="signup-form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label class="form-label" for="signup-fname">First Name</label>
                    <input type="text" id="signup-fname" class="form-input" placeholder="Your first name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-lname">Last Name</label>
                    <input type="text" id="signup-lname" class="form-input" placeholder="Your last name" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" class="form-input" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-phone">Phone Number</label>
                    <input type="tel" id="signup-phone" class="form-input" placeholder="e.g. +91 98765 43210" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signup-password" class="form-input" placeholder="Create a strong password" required minlength="8">
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-password', this.querySelector('i'))" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="signup-confirm">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="signup-confirm" class="form-input" placeholder="Re-enter your password" required>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signup-confirm', this.querySelector('i'))" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="agree-terms" required>
                    <label for="agree-terms">
                        I agree to the <a href="#" style="color:var(--secondary);font-weight:600;">Terms of Service</a> and <a href="#" style="color:var(--secondary);font-weight:600;">Privacy Policy</a>. I consent to receiving renewal reminders via SMS and email.
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-full btn-lg">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);">
                Already have an account? <a href="login.html" class="link-primary">Sign in →</a>
            </p>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        initAuthPage();
    });

    function handleSignup(e) {
        e.preventDefault();
        const pwd = document.getElementById('signup-password').value;
        const confirm = document.getElementById('signup-confirm').value;
        if (pwd !== confirm) {
            alert('Passwords do not match. Please try again.');
            return;
        }
        alert('Account created successfully!\n\nWelcome to DriveSure. You can now log in to track your applications.');
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
